<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>דשבורד קידומים מטא</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#f6f7fb;
    --bg-2:#eef0f8;
    --card-bg:#ffffff;
    --card-bg-hover:#ffffff;
    --border:#e3e6f0;
    --border-soft:rgba(20,25,50,.06);
    --text-1:#1a1f36;
    --text-2:#5c6480;
    --text-3:#9399b3;
    --accent:#5b6bff;
    --accent-2:#9b6dff;
    --accent-3:#ff6d9b;
    --success:#0fb489;
    --warn:#ffb454;
    --shadow: 0 16px 40px -18px rgba(30,35,70,.18);
    --radius-lg:22px;
    --radius-md:14px;
    --radius-sm:9px;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    background:
      radial-gradient(900px 500px at 12% -10%, rgba(91,107,255,.10), transparent 60%),
      radial-gradient(800px 500px at 100% 0%, rgba(155,109,255,.08), transparent 55%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2) 60%);
    background-attachment: fixed;
    color: var(--text-1);
    font-family: 'Heebo', system-ui, sans-serif;
    min-height:100vh;
  }

  ::selection{ background: var(--accent); color:#fff; }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 24px 90px;
  }

  /* ---------- HEADER ---------- */
  header{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:14px;
    margin-bottom: 40px;
    padding: 44px 24px 48px;
    border-radius: var(--radius-lg);
    background:
      radial-gradient(700px 320px at 15% 0%, rgba(109,139,255,.22), transparent 60%),
      radial-gradient(600px 320px at 100% 10%, rgba(255,109,155,.14), transparent 55%),
      linear-gradient(160deg, #0c1633, #101d42 55%, #131f4a);
    box-shadow: var(--shadow);
  }

  .logo-chip{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    background: #ffffff;
    padding: 10px 18px;
    border-radius: 14px;
    box-shadow: 0 10px 24px -12px rgba(0,0,0,.45);
  }

  .logo{
    height: 40px;
    width: auto;
    object-fit: contain;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.03em;
    color: #c7d0ff;
    background: rgba(109,139,255,.16);
    border:1px solid rgba(109,139,255,.32);
    padding:6px 16px;
    border-radius:999px;
  }
  .eyebrow .dot{
    width:7px; height:7px; border-radius:50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow:0 0 10px var(--accent);
  }

  h1{
    font-size: clamp(28px, 4vw, 42px);
    font-weight: 800;
    letter-spacing:-.01em;
    background: linear-gradient(90deg, #fff, #c7d0ff 60%, var(--accent-2));
    -webkit-background-clip:text;
    background-clip:text;
    color: transparent;
  }

  header p{
    color: rgba(224,228,250,.75);
    font-size:15px;
    max-width: 560px;
  }

  /* ---------- SEARCH ---------- */
  .search-wrap{
    position: sticky;
    top: 16px;
    z-index: 40;
    margin: 0 auto 34px;
    max-width: 620px;
  }

  .search-box{
    display:flex;
    align-items:center;
    gap:10px;
    background: rgba(255,255,255,.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 13px 20px;
    box-shadow: var(--shadow);
    transition: border-color .2s, box-shadow .2s;
  }
  .search-box:focus-within{
    border-color: var(--accent);
    box-shadow: 0 0 0 4px rgba(109,139,255,.16), var(--shadow);
  }
  .search-box svg{ flex:none; color: var(--text-3); }
  .search-box input{
    flex:1;
    background:none;
    border:none;
    outline:none;
    color: var(--text-1);
    font-family: inherit;
    font-size: 16px;
  }
  .search-box input::placeholder{ color: var(--text-3); }
  .search-clear{
    flex:none;
    display:none;
    width:24px; height:24px;
    border-radius:50%;
    border:none;
    background: var(--border);
    color: var(--text-2);
    cursor:pointer;
    align-items:center;
    justify-content:center;
    font-size:13px;
  }
  .search-clear.show{ display:flex; }

  .result-count{
    text-align:center;
    font-size:13px;
    color: var(--text-3);
    margin-top:10px;
  }
  .result-count b{ color: var(--text-2); }

  /* ---------- GRID ---------- */
  .grid{
    display:grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }

  .card{
    background: linear-gradient(180deg, var(--card-bg), var(--bg-2));
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 20px 26px;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:16px;
    box-shadow: var(--shadow);
    transition: transform .18s ease, border-color .22s ease, background .22s ease;
    position:relative;
    overflow:hidden;
  }
  @media (min-width: 720px){
    .card{
      flex-direction:row;
      align-items:center;
      justify-content:space-between;
      gap:26px;
    }
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    padding:1px;
    border-radius:inherit;
    background: linear-gradient(135deg, rgba(109,139,255,.35), transparent 40%, rgba(255,109,155,.25));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity:0;
    transition: opacity .25s;
    pointer-events:none;
  }
  .card:hover{
    transform: translateY(-4px);
    background: linear-gradient(180deg, var(--card-bg-hover), var(--bg-2));
  }
  .card:hover::before{ opacity:1; }

  .card-head{
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  @media (min-width: 720px){
    .card-head{ flex: 1 1 auto; min-width: 0; }
  }

  .topic-title{
    font-size: 18px;
    font-weight: 700;
    color: var(--text-1);
    line-height:1.35;
  }
  .topic-title mark{
    background: linear-gradient(180deg, rgba(109,139,255,.4), rgba(109,139,255,.4));
    background-repeat:no-repeat;
    background-position: 0 82%;
    background-size: 100% 40%;
    color: inherit;
    padding: 0 1px;
    border-radius: 3px;
  }

  .meta-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:4px;
  }

  .pill{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12.5px;
    font-weight:500;
    padding:6px 11px;
    border-radius:999px;
    background: rgba(20,25,50,.04);
    border:1px solid var(--border-soft);
    color: var(--text-2);
  }
  .pill.budget{
    color:#0a8f6c;
    background: rgba(15,180,137,.10);
    border-color: rgba(15,180,137,.22);
  }
  .pill.period{
    color:#4453d6;
    background: rgba(91,107,255,.10);
    border-color: rgba(91,107,255,.22);
  }
  .pill svg{ flex:none; opacity:.85; }

  .divider{
    height:1px;
    background: linear-gradient(90deg, transparent, var(--border-soft), transparent);
  }
  @media (min-width: 720px){
    .divider{
      width:1px;
      height:36px;
      align-self:center;
      flex:none;
      background: linear-gradient(180deg, transparent, var(--border-soft), transparent);
    }
  }

  .goals{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
  }
  @media (min-width: 720px){
    .goals{ flex-wrap:nowrap; flex:none; }
  }

  .goal-btn{
    flex:1 1 auto;
    min-width: 128px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    text-decoration:none;
    font-family:inherit;
    font-weight:600;
    font-size:13.5px;
    color:#fff;
    padding:11px 14px;
    border-radius: var(--radius-sm);
    border:1px solid transparent;
    cursor:pointer;
    position:relative;
    isolation:isolate;
    overflow:hidden;
    transition: transform .15s ease, box-shadow .2s ease, filter .2s ease;
  }
  @media (min-width: 720px){
    .goal-btn{ flex:0 0 auto; min-width: 118px; }
  }
  .goal-btn::after{
    content:"";
    position:absolute; inset:0;
    background: rgba(255,255,255,.16);
    opacity:0;
    transition: opacity .2s;
  }
  .goal-btn:hover{ transform: translateY(-2px); filter:saturate(1.15); }
  .goal-btn:hover::after{ opacity:1; }
  .goal-btn:active{ transform: translateY(0); }
  .goal-btn svg{ flex:none; transform: scaleX(-1); }

  .goal-btn.g-views{ background: linear-gradient(135deg,#5b7bff,#7a5bff); box-shadow: 0 8px 18px -8px rgba(91,123,255,.55); }
  .goal-btn.g-engagement{ background: linear-gradient(135deg,#ff6d9b,#ff8f5b); box-shadow: 0 8px 18px -8px rgba(255,109,155,.55); }
  .goal-btn.g-traffic{ background: linear-gradient(135deg,#33d69f,#33b3d6); box-shadow: 0 8px 18px -8px rgba(51,214,159,.5); }
  .goal-btn.g-other{ background: linear-gradient(135deg,#8b93ad,#5f6785); box-shadow: 0 8px 18px -8px rgba(139,147,173,.5); }

  .no-results{
    grid-column: 1 / -1;
    text-align:center;
    padding: 70px 20px;
    color: var(--text-3);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
  }
  .no-results svg{ opacity:.5; }
  .no-results b{ color: var(--text-2); font-size:16px; }

  .card.hidden{ display:none; }

  footer{
    text-align:center;
    margin-top: 60px;
    color: var(--text-3);
    font-size:12.5px;
  }

  @media (max-width:520px){
    .wrap{ padding: 26px 14px 60px; }
    .search-wrap{ top:10px; }
    .goal-btn{ min-width: 100%; }
  }

  /* ---------- SETTINGS FAB ---------- */
  .fab{
    position: fixed;
    bottom: 26px;
    left: 26px;
    width: 54px;
    height: 54px;
    border-radius: 50%;
    border: none;
    display:flex;
    align-items:center;
    justify-content:center;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color:#fff;
    cursor:pointer;
    box-shadow: 0 14px 30px -10px rgba(91,107,255,.55);
    z-index: 200;
    transition: transform .25s ease, box-shadow .2s ease;
  }
  .fab:hover{ transform: translateY(-2px) scale(1.04); box-shadow: 0 18px 36px -10px rgba(91,107,255,.6); }
  .fab svg{ transition: transform .5s ease; }
  .fab:hover svg{ transform: rotate(70deg); }

  /* ---------- EDITOR MODAL ---------- */
  .editor-overlay{
    position: fixed;
    inset: 0;
    background: rgba(15,20,45,.55);
    backdrop-filter: blur(3px);
    display:none;
    align-items:center;
    justify-content:center;
    padding: 20px;
    z-index: 300;
  }
  .editor-overlay.open{ display:flex; }

  .editor-panel{
    background: #ffffff;
    width: 100%;
    max-width: 760px;
    max-height: 88vh;
    border-radius: 20px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
    box-shadow: 0 40px 90px -24px rgba(10,14,30,.5);
  }

  .editor-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding: 18px 22px;
    border-bottom: 1px solid var(--border);
    flex:none;
  }
  .editor-header h2{ font-size:17px; font-weight:700; color:var(--text-1); }

  .icon-btn{
    width:30px; height:30px;
    border-radius:50%;
    border:none;
    background: var(--border);
    color: var(--text-2);
    cursor:pointer;
    font-size:13px;
    flex:none;
  }
  .icon-btn:hover{ background:#dfe3f0; }

  .editor-body{
    padding: 18px 22px;
    overflow-y: auto;
    display:flex;
    flex-direction:column;
    gap:14px;
    flex:1;
  }

  .editor-empty{
    text-align:center;
    color: var(--text-3);
    padding: 40px 10px;
    font-size:14px;
  }

  .editor-footer{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding: 16px 22px;
    border-top: 1px solid var(--border);
    flex:none;
  }

  .topic-editor{
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    display:flex;
    flex-direction:column;
    gap:10px;
    background: var(--bg-1);
  }

  .topic-editor-top{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .topic-editor-top .topic-name-input{
    font-weight:700;
    font-size:14.5px;
  }

  .topic-editor-row{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }

  .topic-editor input[type="text"]{
    flex:1;
    min-width: 130px;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    font-family: inherit;
    font-size: 13px;
    background: #fff;
    color: var(--text-1);
  }
  .topic-editor input[type="text"]:focus{
    outline:none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(91,107,255,.14);
  }

  .goals-editor{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .goal-editor-row{
    display:flex;
    gap:6px;
    align-items:center;
  }
  .goal-editor-row .goal-name{
    flex: 0 0 110px;
    min-width: 90px;
  }
  .goal-editor-row .goal-url{
    flex:1;
    font-size:12px;
    direction: ltr;
    text-align: left;
  }

  .small-x{
    flex:none;
    width:26px; height:26px;
    border-radius:50%;
    border:none;
    background:#fde7ea;
    color:#c23a52;
    cursor:pointer;
    font-size:12px;
  }
  .small-x:hover{ background:#fad0d6; }

  .btn-outline{
    align-self:flex-start;
    background:none;
    border: 1px dashed var(--accent);
    color: var(--accent);
    padding: 8px 14px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-outline:hover{ background: rgba(91,107,255,.08); }

  .btn-danger-outline{
    background:none;
    border: 1px solid #e2536b;
    color: #e2536b;
    padding: 8px 14px;
    border-radius: 9px;
    font-family: inherit;
    font-size: 13px;
    font-weight:600;
    cursor:pointer;
  }
  .btn-danger-outline:hover{ background: rgba(226,83,107,.08); }

  @media (max-width:520px){
    .fab{ bottom:18px; left:18px; width:48px; height:48px; }
    .goal-editor-row{ flex-wrap:wrap; }
    .goal-editor-row .goal-name{ flex:1 1 100%; }
    .goal-editor-row .goal-url{ flex:1 1 100%; }
  }
</style>
</head>

const ICONS = {
  budget: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 10a2 2 0 0 1 2-2h1.5a1.5 1.5 0 0 1 0 3H11a1.5 1.5 0 0 0 0 3h1a2 2 0 0 0 2-2"/></svg>',
  period: '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>',
  goal: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5l7 7-7 7M21 12H3"/></svg>'
};

function goalClass(name){
  if(name.includes('צפיות')) return 'g-views';
  if(name.includes('מעורבות')) return 'g-engagement';
  if(name.includes('תנועה')) return 'g-traffic';
  return 'g-other';
}

function highlight(text, term){
  if(!term) return text;
  const idx = text.toLowerCase().indexOf(term.toLowerCase());
  if(idx === -1) return text;
  return text.slice(0, idx) + '<mark>' + text.slice(idx, idx + term.length) + '</mark>' + text.slice(idx + term.length);
}

const STORAGE_KEY = 'metaAdsDashboardData_v1';

function cloneDefaultData(){
  return JSON.parse(JSON.stringify(DATA));
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(Array.isArray(parsed)) return parsed;
    }
  }catch(e){}
  return cloneDefaultData();
}

let state = loadState();

function saveState(){
  try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
}

const grid = document.getElementById('grid');

function render(term){
  grid.innerHTML = '';
  let visibleCount = 0;

  state.forEach(item => {
    const matches = !term || item.topic.toLowerCase().includes(term.toLowerCase()) ||
      item.goals.some(g => g.name.toLowerCase().includes(term.toLowerCase()));
    if(!matches) return;
    visibleCount++;

    const card = document.createElement('div');
    card.className = 'card';

    const metaPills = [];
    if(item.budget){
      metaPills.push(`<span class="pill budget">${ICONS.budget}${item.budget}</span>`);
    }
    if(item.period){
      metaPills.push(`<span class="pill period">${ICONS.period}${item.period}</span>`);
    }
    if(!item.budget && !item.period){
      metaPills.push(`<span class="pill">לא צוין תקציב/תקופה</span>`);
    }

    const goalsHtml = item.goals.map(g => `
      <a class="goal-btn ${goalClass(g.name)}" href="${g.url}" target="_blank" rel="noopener noreferrer">
        <span>${g.name}</span>${ICONS.goal}
      </a>
    `).join('');

    card.innerHTML = `
      <div class="card-head">
        <div class="topic-title">${highlight(item.topic, term)}</div>
        <div class="meta-row">${metaPills.join('')}</div>
      </div>
      <div class="divider"></div>
      <div class="goals">${goalsHtml}</div>
    `;
    grid.appendChild(card);
  });

  const resultCount = document.getElementById('resultCount');
  if(term){
    resultCount.innerHTML = `נמצאו <b>${visibleCount}</b> נושאים עבור "<b>${term}</b>"`;
  } else {
    resultCount.innerHTML = `<b>${state.length}</b> נושאי תוכן פעילים`;
  }

  if(visibleCount === 0){
    grid.innerHTML = `
      <div class="no-results">
        <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <b>לא נמצאו תוצאות</b>
        <span>נסו מונח חיפוש אחר</span>
      </div>`;
  }
}

const input = document.getElementById('searchInput');
const clearBtn = document.getElementById('clearBtn');

input.addEventListener('input', () => {
  clearBtn.classList.toggle('show', input.value.length > 0);
  render(input.value.trim());
});

clearBtn.addEventListener('click', () => {
  input.value = '';
  clearBtn.classList.remove('show');
  input.focus();
  render('');
});

render('');

/* ---------- EDITOR ---------- */

function escapeAttr(s){
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;');
}

const editorOverlay = document.getElementById('editorOverlay');
const editorBody = document.getElementById('editorBody');
const settingsBtn = document.getElementById('settingsBtn');
const closeEditorBtn = document.getElementById('closeEditor');
const addTopicBtn = document.getElementById('addTopicBtn');
const resetBtn = document.getElementById('resetBtn');

function renderEditor(){
  if(state.length === 0){
    editorBody.innerHTML = `<div class="editor-empty">אין נושאים עדיין — לחצו על "הוסף נושא חדש" כדי להתחיל.</div>`;
    return;
  }
  editorBody.innerHTML = state.map((topic, ti) => `
    <div class="topic-editor" data-ti="${ti}">
      <div class="topic-editor-top">
        <input type="text" class="topic-name-input" data-ti="${ti}" value="${escapeAttr(topic.topic)}" placeholder="שם הנושא">
        <button class="small-x delete-topic" data-ti="${ti}" title="מחק נושא" aria-label="מחק נושא">✕</button>
      </div>
      <div class="topic-editor-row">
        <input type="text" class="budget-input" data-ti="${ti}" value="${escapeAttr(topic.budget)}" placeholder="תקציב (למשל: 180 ש"ח)">
        <input type="text" class="period-input" data-ti="${ti}" value="${escapeAttr(topic.period)}" placeholder="תקופת הקידום">
      </div>
      <div class="goals-editor">
        ${topic.goals.map((g, gi) => `
          <div class="goal-editor-row" data-ti="${ti}" data-gi="${gi}">
            <input type="text" class="goal-name" data-ti="${ti}" data-gi="${gi}" value="${escapeAttr(g.name)}" placeholder="מטרה">
            <input type="text" class="goal-url" data-ti="${ti}" data-gi="${gi}" value="${escapeAttr(g.url)}" placeholder="לינק לתבנית לשכפול">
            <button class="small-x delete-goal" data-ti="${ti}" data-gi="${gi}" title="מחק מטרה" aria-label="מחק מטרה">✕</button>
          </div>
        `).join('')}
      </div>
      <button class="btn-outline add-goal" data-ti="${ti}">+ הוסף מטרה</button>
    </div>
  `).join('');
}

function openEditor(){
  renderEditor();
  editorOverlay.classList.add('open');
}

function closeEditor(){
  editorOverlay.classList.remove('open');
}

settingsBtn.addEventListener('click', openEditor);
closeEditorBtn.addEventListener('click', closeEditor);
editorOverlay.addEventListener('click', (e) => {
  if(e.target === editorOverlay) closeEditor();
});
document.addEventListener('keydown', (e) => {
  if(e.key === 'Escape' && editorOverlay.classList.contains('open')) closeEditor();
});

editorBody.addEventListener('input', (e) => {
  const t = e.target;
  const ti = t.dataset.ti;
  if(ti === undefined) return;
  const topic = state[ti];
  if(!topic) return;
  if(t.classList.contains('topic-name-input')) topic.topic = t.value;
  else if(t.classList.contains('budget-input')) topic.budget = t.value.trim() ? t.value : null;
  else if(t.classList.contains('period-input')) topic.period = t.value.trim() ? t.value : null;
  else if(t.classList.contains('goal-name')) topic.goals[t.dataset.gi].name = t.value;
  else if(t.classList.contains('goal-url')) topic.goals[t.dataset.gi].url = t.value;
  else return;
  saveState();
  render(input.value.trim());
});

editorBody.addEventListener('click', (e) => {
  const delTopic = e.target.closest('.delete-topic');
  if(delTopic){
    state.splice(Number(delTopic.dataset.ti), 1);
    saveState();
    renderEditor();
    render(input.value.trim());
    return;
  }
  const delGoal = e.target.closest('.delete-goal');
  if(delGoal){
    state[Number(delGoal.dataset.ti)].goals.splice(Number(delGoal.dataset.gi), 1);
    saveState();
    renderEditor();
    render(input.value.trim());
    return;
  }
  const addGoal = e.target.closest('.add-goal');
  if(addGoal){
    state[Number(addGoal.dataset.ti)].goals.push({ name: 'מטרה חדשה', url: '' });
    saveState();
    renderEditor();
    render(input.value.trim());
    return;
  }
});

addTopicBtn.addEventListener('click', () => {
  state.push({ topic: 'נושא חדש', budget: null, period: null, goals: [{ name: 'צפיות', url: '' }] });
  saveState();
  renderEditor();
  render(input.value.trim());
});

resetBtn.addEventListener('click', () => {
  if(!confirm('לאפס את כל הנתונים לברירת המחדל המקורית? כל השינויים שנעשו יימחקו.')) return;
  state = cloneDefaultData();
  saveState();
  renderEditor();
  render(input.value.trim());
});
</script>
